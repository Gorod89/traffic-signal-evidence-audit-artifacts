name: Verify artifact package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install corrected-tool environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Run repository-only tests
        run: python -m unittest discover -s tests -v
      - name: Verify pinned protocol bytes
        working-directory: artifacts/protocols
        run: |
          sha256sum -c PREDICTION_LOCK.historical.sha256
          sha256sum -c sealed_population_contract.historical-v1.sha256
      - name: Audit release tree
        run: |
          python scripts/audit/check_aar_artifact.py
          python scripts/audit/audit_inventory.py
          python scripts/audit/check_release.py
          python scripts/audit/build_manifest.py --check
