[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-evidence-tools"
version = "0.1.0"
description = "Fail-closed AAR and sealed-evidence tools for the accompanying article"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18,<2",
]

[project.scripts]
aar = "evidence_tools.aar:main"
evaluate-sealed = "evidence_tools.sealed:main"
collect-sealed = "evidence_tools.collector:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
